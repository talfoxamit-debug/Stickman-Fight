<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stickman Fight: Powder Arena — Phase 1</title>
    <style>
      :root { color-scheme: dark; }
      html, body {
        margin: 0; height: 100%; background: #07060d; overflow: hidden;
        font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      }
      #app { position: fixed; inset: 0; display: grid; place-items: center; }
      canvas {
        image-rendering: optimizeSpeed;
        box-shadow: 0 0 60px rgba(255, 0, 200, 0.25), 0 0 120px rgba(0, 230, 255, 0.15);
        border-radius: 6px;
        max-width: 100vw; max-height: 100vh;
      }
      #hint {
        position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
        color: #8a86a8; font-size: 12px; letter-spacing: 0.5px; pointer-events: none;
        text-align: center; text-shadow: 0 1px 2px #000;
      }
    </style>
  </head>
  <body>
    <div id="app"><canvas id="game" width="1280" height="720"></canvas></div>
    <div id="hint">
      P1: <b>A/D</b> move · <b>W</b> jump (×2) · <b>F</b>/<b>LMB</b> attack · <b>S</b>/<b>RMB</b> block · <b>G</b> grab · <b>mouse</b> aim · <b>double-tap</b> to dodge
      <br/>
      P2: <b>← →</b> move · <b>↑</b> jump (×2) · <b>.</b> attack · <b>↓</b> block · <b>/</b> grab · double-tap to dodge
      <br/>
      Powder sandbox: <b>1–0</b> pick material · hold <b>Q</b> to paint at cursor · <b>C</b> clear &nbsp;|&nbsp;
      <b>B</b> bot · <b>R</b> rematch · <b>P</b> pause
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
